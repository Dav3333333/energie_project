[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These are public Firebase Web SDK / reCAPTCHA site config values, not secrets.
  # They are intentionally embedded in the client bundle; security is enforced by
  # Firebase Security Rules and API key restrictions, not by hiding these values.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_RECAPTCHA_V3_SITE_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"